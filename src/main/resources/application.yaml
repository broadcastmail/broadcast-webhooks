spring:
  config:
    import: optional:classpath:sentry-release.properties
  application:
    name: broadcast-webhooks
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false

app:
  # header Cloudflare adds to every proxied request; unset = check off (PRELAUNCH §7)
  origin-secret: ${ORIGIN_SECRET:}
  encryption:
    key: ${ENCRYPTION_KEY}
  # e2e account ids, comma-separated (Railway shared variable); kept out of analytics
  e2e-account-ids: ${E2E_ACCOUNT_IDS:}
  # unset = billing events aren't sent
  posthog:
    api-key: ${POSTHOG_API_KEY:}

stripe:
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: production
  tags:
    service: webhooks
